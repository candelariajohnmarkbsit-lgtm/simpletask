<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c1f22">
  <title>SimpleTask | Reset Password</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="reset-card">
    <div class="brand" style="margin-bottom: 22px;">
      <div class="brand-mark" aria-hidden="true"><img src="icons/plmun-logo.png" alt=""></div>
      <div class="brand-name">Simple<span>Task</span></div>
    </div>

    <form id="resetForm" class="auth-form hidden">
      <h1>Set a new password</h1>
      <p class="form-intro">Choose a password with at least 8 characters.</p>

      <label for="newPassword">New password</label>
      <div class="input-wrap"><span class="field-icon">▣</span><input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" minlength="8" required></div>

      <label for="confirmNewPassword">Confirm new password</label>
      <div class="input-wrap"><span class="field-icon">▣</span><input id="confirmNewPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required></div>

      <button class="primary-button" type="submit" style="margin-top: 24px;">Save password</button>
    </form>

    <div id="resetInvalid" class="auth-form hidden">
      <h1>Link expired</h1>
      <p class="form-intro">This reset link is invalid or has expired. Request a new one from the login page.</p>
      <a class="primary-button" href="index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">Back to log in</a>
    </div>

    <p id="resetLoading" class="form-intro" style="text-align:center;">Checking your reset link…</p>
    <p class="message" id="resetMessage" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="pwa.js"></script>
  <script src="reset.js"></script>
</body>
</html>
